<header class="navbar-header" [class.scrolled]="isScrolled()">
  <nav class="nav-container">
    <a href="#home" class="brand-logo" (click)="closeMobileMenu()">
      <span class="brand-badge">NB</span>
      <span class="brand-text">
        <span class="brand-first">Nikhil</span>
        <span class="brand-last">Bharadwaj</span>
      </span>
    </a>

    <!-- Desktop Menu -->
    <ul class="nav-menu">
      @for (link of navLinks; track link.href) {
        <li class="nav-item">
          <a
            [href]="link.href"
            class="nav-link"
            [class.active]="activeSection() === link.href.substring(1)"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <!-- Theme Switcher -->
      <button
        class="theme-toggle-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.currentTheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        title="Toggle Theme"
      >
        @if (themeService.currentTheme() === 'dark') {
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>

      <!-- Contact CTA Button -->
      <a href="#contact" class="btn btn-primary btn-sm contact-cta-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Get In Touch
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button
        class="mobile-toggle-btn"
        (click)="toggleMobileMenu()"
        [class.open]="isMobileMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer" [class.open]="isMobileMenuOpen()">
    <ul class="mobile-nav-list">
      @for (link of navLinks; track link.href) {
        <li>
          <a
            [href]="link.href"
            class="mobile-nav-link"
            [class.active]="activeSection() === link.href.substring(1)"
            (click)="closeMobileMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
      <li class="mobile-contact-item">
        <a href="#contact" class="btn btn-primary btn-sm" (click)="closeMobileMenu()">
          Get In Touch
        </a>
      </li>
    </ul>
  </div>
</header>
